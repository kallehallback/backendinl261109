<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Books</title>
</head>

<body>

    <h1>Books</h1>

    <ul>
        <li th:each="book : ${books}">
            <span th:text="${book.title}">Title</span>
            <span th:text="${book.author}">Author</span> 
            <span th:text="${book.genre}">Genre</span>
        </li>
    </ul>

</body>

</html>
